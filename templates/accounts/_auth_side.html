<div class="tc-auth-side d-flex flex-column">
  <a class="d-inline-flex align-items-center gap-2 fw-bold fs-5 text-white text-decoration-none mb-5" href="{% url 'store:home' %}">
    <span class="tc-logo"><i class="bi bi-cpu"></i></span><span>Tech<span class="text-grad">Cart</span></span>
  </a>
  <h2 class="mb-3">{{ side_title }}</h2>
  <p class="mb-4">{{ side_text }}</p>
  <ul class="list-unstyled small mb-0" style="color:#c4c9e0">
    <li class="mb-2"><i class="bi bi-check-circle-fill me-2 text-accent"></i>Cart saved to your account on every device</li>
    <li class="mb-2"><i class="bi bi-check-circle-fill me-2 text-accent"></i>Track every order from pending to delivered</li>
    <li><i class="bi bi-check-circle-fill me-2 text-accent"></i>Cash on delivery, free shipping</li>
  </ul>
  {% if showcase %}
    <div class="tc-auth-imgs mt-auto pt-4">
      {% for p in showcase %}<img src="{{ p.image.url }}" alt="{{ p.name }}">{% endfor %}
    </div>
  {% endif %}
</div>
